<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Duck Farm Studio — Quản lý Key</title>
<style>
:root{--bg:#f4efe4;--panel:#fffaf0;--green:#456c3c;--green2:#5d8752;--wood:#724b2d;--gold:#e3b35a;--red:#b54236;--text:#2c241c;--muted:#786b5d;--border:#d9c7a6}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f4efe4,#e8f0df);color:var(--text)}
.wrap{max-width:1180px;margin:32px auto;padding:0 16px}.hero{background:var(--wood);color:white;border-radius:18px;padding:22px 24px;box-shadow:0 8px 30px #0002}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:#f7e9d2}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 6px 20px #0000000c}.card h2{margin:0 0 14px;color:var(--green)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:white;font:inherit}textarea{min-height:80px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--green);color:white}button:hover{filter:brightness(.95)}button.alt{background:var(--gold);color:#2c241c}button.danger{background:var(--red)}button.ghost{background:#eee2ce;color:#4d3827}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{font-size:13px;margin-top:10px;color:var(--muted);min-height:18px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{max-width:320px}.table-wrap{overflow:auto;max-height:660px;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:920px;background:white}th,td{padding:10px 9px;border-bottom:1px solid #eee4d5;text-align:left;font-size:13px}th{position:sticky;top:0;background:#e9dfca;color:#493622;z-index:1}tr:hover td{background:#fff8e9}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.active{background:#dff1d8;color:#315c2c}.blocked{background:#f7d9d5;color:#8e3027}.expired{background:#f8e4bd;color:#835b11}.key{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:800}.mini{padding:6px 8px;font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.hero{border-radius:0}.wrap{margin-top:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🦆 Duck Farm Studio — Quản lý Key</h1>
    <p>Tạo Key, chỉnh số ngày, gia hạn, khóa/mở Key và theo dõi ngày hết hạn.</p>
  </div>
  <div class="grid">
    <section class="card">
      <h2>🔐 Quyền quản trị</h2>
      <label>ADMIN_SECRET</label>
      <input id="adminSecret" type="password" placeholder="Nhập mật khẩu quản trị" autocomplete="current-password" />
      <div class="actions"><button onclick="saveSecret()">Lưu phiên này</button><button class="ghost" onclick="loadKeys()">Kiểm tra</button></div>
      <div id="authStatus" class="status"></div>

      <hr style="border:0;border-top:1px solid #e6d8c0;margin:20px 0">
      <h2>➕ Tạo Key</h2>
      <label>Số ngày sử dụng</label>
      <input id="days" type="number" value="30" min="1" max="3650" />
      <label>Key tùy chọn <span style="font-weight:400;color:var(--muted)">(để trống = tự sinh)</span></label>
      <input id="customKey" placeholder="DUCK-XXXXXX-XXXXXX-XXXXXX" />
      <label>Ghi chú</label>
      <textarea id="note" placeholder="Tên khách / số điện thoại / ghi chú..."></textarea>
      <div class="actions"><button class="alt" onclick="createKey()">TẠO KEY</button></div>
      <div id="createStatus" class="status"></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <input id="search" placeholder="Tìm Key / ghi chú..." oninput="render()" />
        <button onclick="loadKeys()">↻ Làm mới</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Key</th><th>Trạng thái</th><th>Hết hạn</th><th>Còn</th><th>Ghi chú</th><th>Dùng</th><th>Thao tác</th></tr></thead><tbody id="tbody"></tbody></table></div>
      <div id="listStatus" class="status"></div>
    </section>
  </div>
</div>
<script>
let items=[];
const $=id=>document.getElementById(id);
function secret(){return $('adminSecret').value.trim() || sessionStorage.getItem('duck_admin_secret') || ''}
function saveSecret(){sessionStorage.setItem('duck_admin_secret',$('adminSecret').value.trim());$('authStatus').textContent='Đã lưu trong phiên trình duyệt.';loadKeys()}
async function api(path, opts={}){
  const headers={'Content-Type':'application/json','X-Admin-Key':secret(),...(opts.headers||{})};
  const r=await fetch(path,{...opts,headers});
  let data={}; try{data=await r.json()}catch{}
  if(!r.ok||data.ok===false) throw new Error(data.error||data.message||('HTTP '+r.status));
  return data;
}
function fmtDate(v){if(!v)return '-';return new Date(v).toLocaleString('vi-VN')}
function left(v){const ms=new Date(v)-new Date();if(ms<=0)return 'Hết hạn';const d=Math.ceil(ms/86400000);return d+' ngày'}
function state(row){if(row.status==='blocked')return ['blocked','Đã khóa'];if(new Date(row.expires_at)<=new Date())return ['expired','Hết hạn'];return ['active','Đang dùng']}
async function loadKeys(){
  $('listStatus').textContent='Đang tải...';
  try{const d=await api('/api/admin/list');items=d.items||[];$('authStatus').textContent='Đăng nhập quản trị thành công.';$('listStatus').textContent=`${items.length} Key`;render()}
  catch(e){$('authStatus').textContent='Lỗi: '+e.message;$('listStatus').textContent='Không tải được danh sách.'}
}
function render(){
  const q=$('search').value.trim().toLowerCase();const body=$('tbody');body.innerHTML='';
  const rows=items.filter(x=>!q||String(x.license_key).toLowerCase().includes(q)||String(x.note||'').toLowerCase().includes(q));
  if(!rows.length){body.innerHTML='<tr><td colspan="7" class="empty">Không có Key phù hợp</td></tr>';return}
  for(const row of rows){const [cls,txt]=state(row);const tr=document.createElement('tr');
    tr.innerHTML=`<td class="key">${esc(row.license_key)}</td><td><span class="pill ${cls}">${txt}</span></td><td>${fmtDate(row.expires_at)}</td><td>${left(row.expires_at)}</td><td>${esc(row.note||'')}</td><td>${row.use_count||0}</td><td><div class="actions" style="margin:0"><button class="mini" onclick="extendKey('${row.license_key}',7)">+7</button><button class="mini" onclick="extendKey('${row.license_key}',30)">+30</button><button class="mini ghost" onclick="toggleKey('${row.license_key}','${row.status==='active'?'blocked':'active'}')">${row.status==='active'?'Khóa':'Mở'}</button><button class="mini danger" onclick="deleteKey('${row.license_key}')">Xóa</button></div></td>`;body.appendChild(tr)}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function createKey(){
  $('createStatus').textContent='Đang tạo...';
  try{const d=await api('/api/admin/create',{method:'POST',body:JSON.stringify({days:Number($('days').value),key:$('customKey').value,note:$('note').value})});$('createStatus').innerHTML='Đã tạo: <b class="key">'+esc(d.item.license_key)+'</b>';$('customKey').value='';$('note').value='';await loadKeys()}
  catch(e){$('createStatus').textContent='Lỗi: '+e.message}
}
async function extendKey(key,days){try{await api('/api/admin/extend',{method:'POST',body:JSON.stringify({key,days})});await loadKeys()}catch(e){alert(e.message)}}
async function toggleKey(key,status){try{await api('/api/admin/toggle',{method:'POST',body:JSON.stringify({key,status})});await loadKeys()}catch(e){alert(e.message)}}
async function deleteKey(key){if(!confirm('Xóa vĩnh viễn Key '+key+'?'))return;try{await api('/api/admin/delete',{method:'POST',body:JSON.stringify({key})});await loadKeys()}catch(e){alert(e.message)}}
$('adminSecret').value=sessionStorage.getItem('duck_admin_secret')||'';
if($('adminSecret').value) loadKeys();
</script>
</body></html>
